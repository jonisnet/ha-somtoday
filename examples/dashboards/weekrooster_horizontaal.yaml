# The active week as coloured lesson blocks in columns side by side.
#
# A single card for a sections view — no vertical-stack wrapper. Give it the
# full width of the section, otherwise there is nothing to lay out
# horizontally:
#
#   grid_options:
#     columns: full
#
# The layout is a flexbox with `flex-wrap`, deliberately, rather than a
# horizontal-stack or a fixed column count. It reflows on the *actual* width
# available, so the same card gives five columns on a desktop section and one
# on a phone — without breakpoints to guess at, and without squeezing five
# columns into a phone the way horizontal-stack would.
#
# COLOURS: edit `kleuren` below to match your own subjects. The key is the
# subject abbreviation Somtoday uses (visible as `subject_short` in the
# sensor's attributes). Anything not listed falls back to the theme's accent,
# so an unmapped subject still looks deliberate rather than broken.
#
# Subject abbreviations are used instead of full names: "lichamelijke
# opvoeding" in a 150px column wraps into an unreadable stack. The full name is
# in the tooltip.
#
# Replace <naam> with your student's slug.
type: markdown
grid_options:
  columns: full
content: |
  {% set w = 'sensor.somtoday_<naam>_deze_week' %}
  {% set kleuren = {
    'ne': '#42a5f5', 'en': '#66bb6a', 'wi': '#ab47bc', 'm&m': '#ffa726',
    'lo': '#26c6da', 'bio': '#8bc34a', 'ak': '#ff7043', 'rek': '#7e57c2',
    'gs': '#c2185b', 'nask': '#00acc1', 'du': '#8d6e63', 'fa': '#5c6bc0' } %}
  {% set dagen = ['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'] %}
  {% set maanden = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'] %}
  {% set uitleg = {
    'cancelled': 'vervalt', 'extra': 'extra les',
    'different_room': 'ander lokaal', 'different_teacher': 'andere docent',
    'different_time': 'andere tijd', 'different_subject': 'ander vak' } %}
  {% set days = state_attr(w, 'days') or [] %}
  {% set afw = state_attr(w, 'deviation_count') or 0 %}
  {% set vandaag = now().date().isoformat() %}
  <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px">
    <span style="font-size:1.25rem;font-weight:600">Week {{ state_attr(w, 'week_number') }}</span>
    <span style="color:var(--secondary-text-color);font-size:.9em">{{ state_attr(w, 'lesson_count') }} lessen</span>
    {%- if afw %}
    <span style="background:var(--warning-color);color:#000;border-radius:10px;padding:1px 9px;font-size:.8em;font-weight:600">
      {{ afw }} {{ 'afwijking' if afw == 1 else 'afwijkingen' }}</span>
    {%- endif %}
  </div>

  {% if days -%}
  <div style="display:flex;flex-wrap:wrap;gap:12px 14px;margin-top:10px">
  {%- for d in days -%}
    {%- set datum = d.date | as_datetime -%}
    {%- set is_vandaag = d.date == vandaag -%}
    {#- flex-basis is the wrap threshold: below ~150px a column stops being
        readable, so that is where it folds to the next row. -#}
    <div style="flex:1 1 155px;min-width:145px">
      <div style="font-weight:600;font-size:.95em;padding:2px 0 5px;margin-bottom:7px;
        border-bottom:2px solid {{ 'var(--primary-color)' if is_vandaag else 'var(--divider-color)' }};
        color:{{ 'var(--primary-color)' if is_vandaag else 'var(--primary-text-color)' }}">
        {{ dagen[d.weekday - 1] }} {{ datum.day }} {{ maanden[datum.month - 1] }}
      </div>
      {%- for l in d.lessons -%}
        {%- set van = l.start | as_datetime | as_local -%}
        {%- set naam = l.subject_short or l.subject or 'les' -%}
        {%- set kleur = kleuren.get(naam | lower, 'var(--primary-color)') -%}
        {%- if l.cancelled -%}{% set kleur = 'var(--error-color)' %}{% endif -%}
        <div title="{{ l.subject or 'les' }}{% if l.teacher %} · {{ l.teacher }}{% endif %}"
          style="border-left:3px solid {{ kleur }};background:var(--secondary-background-color);
            border-radius:0 6px 6px 0;padding:4px 7px;margin-bottom:5px;line-height:1.3">
          <div style="display:flex;justify-content:space-between;gap:6px;align-items:baseline">
            <span style="font-weight:600;{% if l.cancelled %}text-decoration:line-through;opacity:.55{% endif %}">{{ naam }}</span>
            <span style="color:var(--secondary-text-color);font-size:.82em;white-space:nowrap">{{ van.strftime('%H:%M') }}</span>
          </div>
          <div style="color:var(--secondary-text-color);font-size:.8em">
            {%- if l.location %}lokaal {{ l.location }}{% endif -%}
            {%- if l.teacher %} · {{ l.teacher }}{% endif -%}
          </div>
          {%- if l.deviates %}
          <div style="color:var(--warning-color);font-size:.78em;font-weight:600;margin-top:1px">
            {{ uitleg.get(l.deviation, l.deviation) }}</div>
          {%- endif %}
        </div>
      {%- endfor -%}
      {%- for m in d.missing -%}
        <div style="border-left:3px dashed var(--error-color);border-radius:0 6px 6px 0;
          padding:4px 7px;margin-bottom:5px;line-height:1.3;opacity:.7">
          <div style="display:flex;justify-content:space-between;gap:6px;align-items:baseline">
            <span style="text-decoration:line-through">{{ m.subject_short or m.subject or 'les' }}</span>
            <span style="color:var(--secondary-text-color);font-size:.82em">{{ m.start_time }}</span>
          </div>
          <div style="color:var(--warning-color);font-size:.78em;font-weight:600">niet op het rooster</div>
        </div>
      {%- endfor -%}
      {%- if not d.lessons and not d.missing -%}
        <div style="color:var(--secondary-text-color);font-size:.85em;font-style:italic">vrij</div>
      {%- endif -%}
    </div>
  {%- endfor -%}
  </div>
  {%- else -%}
  Geen lessen deze week.
  {%- endif %}
