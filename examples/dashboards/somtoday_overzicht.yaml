# One card with everything school-related, built from Home Assistant's own
# cards — no HACS card needed.
#
# Replace every <naam> with your student's slug. On a Dutch Home Assistant the
# sensors are `volgende_les`, `eerstvolgende_schooldag`, `openstaand_huiswerk`,
# `volgende_toets`, `huidige_les`; on an English one they read `next_lesson`,
# `next_school_day`, `open_homework`, `next_test`, `current_lesson`.
#
# Day and month names are spelled out in Jinja rather than left to strftime:
# Home Assistant renders templates in the C locale, so %A would give English
# names on a Dutch dashboard.
type: vertical-stack
cards:
  # ---------------------------------------------------------------- status --
  - type: markdown
    content: |
      {% set huidig = 'sensor.somtoday_<naam>_huidige_les' %}
      {% set volgende = 'sensor.somtoday_<naam>_volgende_les' %}
      {% set dagen = ['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'] %}
      {% if states(huidig) not in ['unknown','unavailable','none'] %}
        ## 🎒 Nu: {{ states(huidig) }}
        Tot {{ (state_attr(huidig,'end') | as_datetime | as_local).strftime('%H:%M') }}
        {%- if state_attr(huidig,'location') %} · lokaal {{ state_attr(huidig,'location') }}{% endif %}
        {%- if state_attr(huidig,'teacher') %} · {{ state_attr(huidig,'teacher') }}{% endif %}
      {% elif states(volgende) not in ['unknown','unavailable','none'] %}
        {% set start = states(volgende) | as_datetime | as_local %}
        ## ⏭️ Volgende: {{ state_attr(volgende,'subject') or 'les' }}
        {{ dagen[start.weekday()] }} {{ start.strftime('%H:%M') }}
        {%- if state_attr(volgende,'location') %} · lokaal {{ state_attr(volgende,'location') }}{% endif %}
        {%- if state_attr(volgende,'teacher') %} · {{ state_attr(volgende,'teacher') }}{% endif %}
      {% else %}
        ## 🏖️ Geen lessen gepland
      {% endif %}

  # -------------------------------------------------------------- dagrooster --
  - type: markdown
    content: |
      {% set s = 'sensor.somtoday_<naam>_eerstvolgende_schooldag' %}
      {% set lessons = state_attr(s, 'lessons') or [] %}
      {% set dagen = ['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'] %}
      {% set maanden = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'] %}
      {% if lessons %}
        {% set d = state_attr(s,'date') | as_datetime %}
        ### 📅 {{ dagen[d.weekday()] }} {{ d.day }} {{ maanden[d.month - 1] }}
        {{ state_attr(s,'lesson_count') }} lessen ·
        {{ (state_attr(s,'first_lesson') | as_datetime | as_local).strftime('%H:%M') }}–{{ (state_attr(s,'last_lesson_end') | as_datetime | as_local).strftime('%H:%M') }}
        {%- if state_attr(s,'cancelled_count') %} · **{{ state_attr(s,'cancelled_count') }} vervallen**{% endif %}

        | | Tijd | Vak | Lok. | Doc. |
        |--:|:--|:--|:--|:--|
        {% for l in lessons -%}
        {%- set van = l.start | as_datetime | as_local -%}
        {%- set tot = l.end | as_datetime | as_local -%}
        {%- set nu = van <= now() < tot and not l.cancelled -%}
        | {{ l.period_start or '' }} | {{ van.strftime('%H:%M') }}–{{ tot.strftime('%H:%M') }} |
        {{- ' ' }}{% if l.cancelled %}~~{{ l.subject or 'les' }}~~{% elif nu %}**{{ l.subject or 'les' }}** ◀{% else %}{{ l.subject or 'les' }}{% endif %} |
        {{- ' ' }}{{ l.location or '–' }} | {{ l.teacher or '–' }} |
        {% endfor %}
      {% else %}
        ### 📅 Geen rooster
        Er staan geen lessen gepland in de opgehaalde periode.
      {% endif %}

  # ------------------------------------------------------------------ toets --
  - type: markdown
    content: |
      {% set t = 'sensor.somtoday_<naam>_volgende_toets' %}
      {% set dagen = ['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'] %}
      {% if states(t) not in ['unknown','unavailable','none'] %}
        {% set due = states(t) | as_datetime | as_local %}
        {% set dagen_tot = (due.date() - now().date()).days %}
        ### 📝 Volgende toets
        **{{ state_attr(t,'subject') or 'toets' }}** — {{ state_attr(t,'topic') or 'geen onderwerp' }}
        {{ dagen[due.weekday()] }} {{ due.day }}-{{ due.month }} om {{ due.strftime('%H:%M') }}
        {%- if dagen_tot == 0 %} · **vandaag**
        {%- elif dagen_tot == 1 %} · **morgen**
        {%- else %} · over {{ dagen_tot }} dagen{% endif %}
      {% else %}
        ### 📝 Geen toets gepland
      {% endif %}

  # --------------------------------------------------------------- huiswerk --
  - type: markdown
    content: |
      {% set h = 'sensor.somtoday_<naam>_openstaand_huiswerk' %}
      {% set items = state_attr(h, 'homework') or [] %}
      {% set dagen = ['ma','di','wo','do','vr','za','zo'] %}
      ### ✏️ Huiswerk ({{ states(h) }})
      {% if items %}
        {% for i in items -%}
        {%- if i.due -%}
        {%- set due = i.due | as_datetime | as_local -%}
        {%- set over = (due.date() - now().date()).days -%}
        **{{ dagen[due.weekday()] }} {{ due.day }}-{{ due.month }}**{% if over <= 1 %} ⚠️{% endif %} ·
        {%- else -%}
        **geen datum** ·
        {%- endif %} {{ i.subject or 'vak onbekend' }} — {{ i.topic or 'huiswerk' }}
        {% endfor %}
      {% else %}
        Niets openstaand. 🎉
      {% endif %}

  # ------------------------------------------------------------- diagnostiek --
  - type: entities
    entities:
      - entity: sensor.somtoday_<naam>_laatste_update
        name: Laatst bijgewerkt
        icon: mdi:update
    state_color: false
