blueprint:
  name: Somtoday - melding bij roosterwijziging
  description: >-
    Stuurt een bericht naar de telefoons die je kiest zodra er iets aan het
    rooster verandert: een les die uitvalt, verschuift, een ander lokaal of een
    andere docent krijgt, of die erbij komt of verdwijnt. Je ziet steeds wat het
    wás en wat het nú is.


    **Wat je nodig hebt:** de Somtoday-integratie geïnstalleerd en ingesteld, en
    de Home Assistant-app op de telefoons die bericht moeten krijgen.


    **Wat je moet invullen:** alleen de eerste twee vragen zijn verplicht - wie
    er bericht krijgt, en welke pagina opengaat als je op de melding tikt. De
    rest mag je overslaan.


    Goed om te weten: valt een hele dag uit, dan krijg je één bericht en niet
    zeven. En na een herstart van Home Assistant blijft het de eerste keer stil,
    anders zou elke herstart lijken alsof het hele rooster net veranderd was.
  domain: automation
  source_url: https://github.com/jonisnet/ha-somtoday/blob/main/blueprints/automation/jonisnet/somtoday_roosterwijziging.yaml
  input:
    ontvangers:
      name: 1. Wie krijgt de melding?
      description: >-
        Kies de telefoons of tablets die bericht moeten krijgen. Alleen
        apparaten met de Home Assistant-app erop staan in de lijst. Je mag er
        meerdere kiezen.
      selector:
        device:
          filter:
            integration: mobile_app
          multiple: true
    dashboard:
      name: 2. Welke pagina gaat open als je op de melding tikt?
      description: >-
        Vul het adres van de pagina in, beginnend met een schuine streep -
        bijvoorbeeld /lovelace/school.


        Weet je het adres niet? Open de pagina in je browser en kijk in de
        adresbalk: alles achter het webadres is wat je hier nodig hebt. Staat er
        home.jouwnaam.nl/lovelace/school, dan vul je /lovelace/school in.


        Geen idee, of maakt het niet uit? Laat /lovelace/0 staan. Dat is je
        standaard-dashboard.
      default: /lovelace/0
      selector:
        text: {}
    ontvangers_afwijkend:
      name: 3. Moet iemand naar een ándere pagina? (mag je overslaan)
      description: >-
        Alleen invullen als niet iedereen bij dezelfde pagina mag of moet
        uitkomen - bijvoorbeeld iemand die alleen zijn eigen dashboard mag zien.


        Gaat iedereen naar dezelfde pagina? Laat dit leeg en sla ook vraag 4
        over.
      default: []
      selector:
        device:
          filter:
            integration: mobile_app
          multiple: true
    dashboard_afwijkend:
      name: 4. Welke pagina voor die mensen?
      description: >-
        Alleen van belang als je bij vraag 3 iemand hebt gekozen. Werkt hetzelfde
        als vraag 2: het adres vanaf de schuine streep.
      default: /lovelace/0
      selector:
        text: {}
    dagen_vooruit:
      name: 5. Hoe ver vooruit wil je gewaarschuwd worden? (mag je overslaan)
      description: >-
        Bij 2 dagen hoor je alleen over vandaag en morgen. Een les die over drie
        weken verschuift stoort je dan niet 's avonds.


        Het weekend wordt automatisch overbrugd: op donderdag en vrijdag loopt
        het door tot en met maandag, zodat je een wijziging voor maandag nog op
        vrijdag te horen krijgt.
      default: 2
      selector:
        number:
          min: 0
          max: 14
          step: 1
          mode: slider
          unit_of_measurement: dagen
    leerling:
      name: 6. Over welk kind? (mag je overslaan)
      description: >-
        Heb je één kind in Somtoday staan, laat dit dan leeg.


        Bij meerdere kinderen kun je er hier één kiezen; deze automatisering gaat
        dan alleen over dat kind. Wil je van allebei bericht, laat het leeg - of
        maak twee automatiseringen als ze naar verschillende telefoons moeten.
      default: []
      selector:
        device:
          filter:
            integration: somtoday
          multiple: false

triggers:
  - trigger: event
    event_type: somtoday_schedule_changed

variables:
  apparaten: !input ontvangers
  pad: !input dashboard
  apparaten_afwijkend: !input ontvangers_afwijkend
  pad_afwijkend: !input dashboard_afwijkend
  dagen: !input dagen_vooruit
  leerling_apparaat: !input leerling

  # Elke ontvanger als {service, dashboard}. De notify-service van de Companion
  # App heet naar de apparaatnaam, dus die kan hieruit afgeleid worden - zo
  # hoeft niemand servicenamen over te typen.
  ontvangers_lijst: >-
    {% set ns = namespace(items=[]) %}
    {% for d in apparaten %}
      {% set ns.items = ns.items + [{
        'service': 'notify.mobile_app_' ~ (device_attr(d, 'name') | slugify),
        'dashboard': pad }] %}
    {% endfor %}
    {% for d in apparaten_afwijkend %}
      {% set ns.items = ns.items + [{
        'service': 'notify.mobile_app_' ~ (device_attr(d, 'name') | slugify),
        'dashboard': pad_afwijkend }] %}
    {% endfor %}
    {{ ns.items }}

  # Hoeveel dagen vooruit er gemeld wordt, met het weekend overbrugd: eindigt
  # het venster op zaterdag of zondag, dan loopt het door tot maandag.
  limiet: >-
    {% set wd = now().weekday() %}
    {% set basis = dagen | int %}
    {% set naar_maandag = (7 - wd) % 7 %}
    {% if ((wd + basis) % 7) in [5, 6] and naar_maandag > basis %}
      {{ naar_maandag }}
    {% else %}
      {{ basis }}
    {% endif %}

  # De wijzigingen die binnen dat venster vallen. Eén keer bepaald, zodat de
  # conditie, de titel en het bericht gegarandeerd over dezelfde set gaan.
  relevant: >-
    {% set ns = namespace(items=[]) %}
    {% for c in trigger.event.data.changes %}
      {% if 0 <= ((c.start | as_datetime | as_local).date() - now().date()).days <= (limiet | int) %}
        {% set ns.items = ns.items + [c] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

conditions:
  # Zwijgen als elke wijziging buiten het venster valt; anders zou er een lege
  # melding uitgaan over iets dat weken weg is.
  - condition: template
    value_template: "{{ relevant | count > 0 }}"
  # En zwijgen over andere kinderen, als er één gekozen is.
  - condition: template
    value_template: >-
      {{ not leerling_apparaat
         or trigger.event.data.device_id == leerling_apparaat }}

actions:
  - repeat:
      for_each: "{{ ontvangers_lijst }}"
      sequence:
        - action: "{{ repeat.item.service }}"
          data:
            title: >-
              {%- set n = relevant | count -%}
              {%- set weg = relevant | selectattr('type', 'eq', 'cancelled') | list | count -%}
              {%- if n == 1 -%}
                Roosterwijziging
              {%- elif weg == n -%}
                {{ n }} lessen vervallen
              {%- else -%}
                {{ n }} roosterwijzigingen
              {%- endif -%}
            # Regel voor regel opgebouwd en daarna samengevoegd: YAML-folding en
            # Jinja-inspringing werken elkaar tegen en maken van doorlopende
            # tekst een rafelige melding op een telefoon.
            message: >-
              {%- set labels = {
                'cancelled': 'Vervalt', 'reinstated': 'Gaat toch door',
                'moved': 'Verplaatst', 'room_changed': 'Ander lokaal',
                'teacher_changed': 'Andere docent', 'added': 'Nieuwe les',
                'removed': 'Van rooster af' } -%}
              {%- set dagnamen = ['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'] -%}
              {%- set maanden = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'] -%}
              {%- set ns = namespace(lines=[]) -%}
              {%- for c in relevant -%}
                {%- set nu = c.start | as_datetime | as_local -%}
                {%- set eind = c.end | as_datetime | as_local -%}
                {%- if ns.lines -%}{%- set ns.lines = ns.lines + [''] -%}{%- endif -%}
                {%- set ns.lines = ns.lines + [
                      labels.get(c.type, c.type) ~ ': ' ~ (c.subject or 'les')
                      ~ ' (' ~ dagnamen[nu.weekday()] ~ ' ' ~ nu.day ~ ' ' ~ maanden[nu.month - 1] ~ ')'] -%}
                {#- c.get('previous'), niet c.previous: een ingelaste les heeft
                    geen vorige versie, en een ontbrekende sleutel levert in
                    Home Assistant een template-fout op per wijziging per
                    toestel - ook als de omringende if het netjes afvangt. -#}
                {%- set vorig = c.get('previous') -%}
                {%- if vorig -%}
                  {%- set was = vorig.start | as_datetime | as_local -%}
                  {%- set was_eind = vorig.end | as_datetime | as_local -%}
                  {%- set ns.lines = ns.lines + ['  was: ' ~ was.strftime('%H:%M') ~ '-' ~ was_eind.strftime('%H:%M')
                        ~ (' · ' ~ vorig.location if vorig.location else '')
                        ~ (' · ' ~ vorig.teacher if vorig.teacher else '')] -%}
                {%- elif c.type == 'removed' -%}
                  {%- set ns.lines = ns.lines + ['  was: ' ~ nu.strftime('%H:%M') ~ '-' ~ eind.strftime('%H:%M')
                        ~ (' · ' ~ c.location if c.location else '')
                        ~ (' · ' ~ c.teacher if c.teacher else '')] -%}
                {%- endif -%}
                {%- if c.type == 'cancelled' -%}
                  {%- set ns.lines = ns.lines + ['  nu:  vervalt'] -%}
                {%- elif c.type == 'removed' -%}
                  {%- set ns.lines = ns.lines + ['  nu:  van het rooster af'] -%}
                {%- else -%}
                  {%- set ns.lines = ns.lines + ['  nu:  ' ~ nu.strftime('%H:%M') ~ '-' ~ eind.strftime('%H:%M')
                        ~ (' · ' ~ c.location if c.location else '')
                        ~ (' · ' ~ c.teacher if c.teacher else '')] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.lines | join('\n') }}
            data:
              # clickAction is Android, url is iOS. Allebei meesturen scheelt
              # weten welke telefoon welke is.
              clickAction: "{{ repeat.item.dashboard }}"
              url: "{{ repeat.item.dashboard }}"

# `queued`, niet `single`: twee kinderen op één account worden in dezelfde poll
# opgehaald, dus twee events kunnen op hetzelfde moment binnenkomen.
mode: queued
max: 10
