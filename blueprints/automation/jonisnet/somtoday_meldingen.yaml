blueprint:
  name: Somtoday - meldingen bij nieuwe cijfers, berichten en meer
  description: >-
    Eén automatisering voor alle Somtoday-meldingen. Per soort melding (nieuw
    cijfer, afwezigheid of te laat, maatregel, bericht van school, nieuwe
    inleveropdracht, storing bij Somtoday) kies je in een eigen blok wie hem
    krijgt, wie de inhoud zelf te zien krijgt en over welk kind het gaat.
    Laat je bij een soort niemand staan, dan gaat die melding nergens heen.


    **Wat je nodig hebt:** de Somtoday-integratie (versie 0.2.0 of nieuwer) en
    de Home Assistant-app op de telefoons die bericht moeten krijgen.


    **Privacy:** cijfers, afwezigheid, maatregelen en berichten staan niet in
    Home Assistant-entiteiten, zodat niet iedereen in huis ze kan lezen. Deze
    automatisering haalt ze pas op op het moment van de melding, en laat de
    inhoud alleen zien op de telefoons die je bij "inhoud" kiest. De andere
    ontvangers krijgen alleen dát er iets nieuws is. Kies geen gedeelde tablet
    voor de inhoud.


    Goed om te weten: bij de allereerste keer ophalen leert de integratie wat
    er al stond, zonder meldingen. Daarna krijg je alleen wat echt nieuw is,
    ook na een herstart.
  domain: automation
  source_url: https://github.com/jonisnet/ha-somtoday/blob/main/blueprints/automation/jonisnet/somtoday_meldingen.yaml
  input:
    algemeen:
      name: Algemeen
      icon: mdi:cog-outline
      input:
        dashboard:
          name: Welke pagina gaat open als je op de melding tikt?
          description: >-
            Het adres vanaf de schuine streep, bijvoorbeeld /lovelace/school.
            Geen idee? Laat /lovelace/0 staan, dat is je standaard-dashboard.
          default: /lovelace/0
          selector:
            select:
              custom_value: true
              mode: dropdown
              options:
                - /lovelace/0
                - /lovelace/school

    cijfers:
      name: Nieuw cijfer
      icon: mdi:numeric-10-box-outline
      collapsed: true
      input:
        cijfer_ontvangers:
          name: Wie krijgt de melding?
          description: Leeg laten = geen meldingen over cijfers.
          default: []
          selector: &telefoons
            device:
              filter:
                integration: mobile_app
              multiple: true
        cijfer_inhoud:
          name: Wie ziet het cijfer zelf in de melding?
          description: >-
            Alleen deze ontvangers zien vak, cijfer en weging. De rest krijgt
            "Nieuw cijfer, open de Somtoday-kaart".
          default: []
          selector: *telefoons
        cijfer_leerlingen:
          name: Over welk kind?
          description: Leeg laten = alle kinderen.
          default: []
          selector: &kinderen
            device:
              filter:
                integration: somtoday
              multiple: true

    afwezigheid:
      name: Afwezigheid, te laat en dergelijke
      icon: mdi:account-clock-outline
      collapsed: true
      input:
        afwezig_ontvangers:
          name: Wie krijgt de melding?
          description: >-
            Ook uit de les gestuurd, huiswerk niet gemaakt en materiaal niet in
            orde. Leeg laten = geen meldingen hierover.
          default: []
          selector: *telefoons
        afwezig_inhoud:
          name: Wie ziet de reden, het uur en het vak in de melding?
          default: []
          selector: *telefoons
        afwezig_leerlingen:
          name: Over welk kind?
          description: Leeg laten = alle kinderen.
          default: []
          selector: *kinderen

    maatregelen:
      name: Maatregel (nablijven, strafwerk)
      icon: mdi:gavel
      collapsed: true
      input:
        maatregel_ontvangers:
          name: Wie krijgt de melding?
          description: Leeg laten = geen meldingen over maatregelen.
          default: []
          selector: *telefoons
        maatregel_inhoud:
          name: Wie ziet de maatregel zelf in de melding?
          default: []
          selector: *telefoons
        maatregel_leerlingen:
          name: Over welk kind?
          description: Leeg laten = alle kinderen.
          default: []
          selector: *kinderen

    berichten:
      name: Bericht van school
      icon: mdi:email-outline
      collapsed: true
      input:
        bericht_ontvangers:
          name: Wie krijgt de melding?
          description: >-
            Berichten horen bij het hele account, niet bij één kind. Leeg
            laten = geen meldingen over berichten.
          default: []
          selector: *telefoons
        bericht_inhoud:
          name: Wie ziet afzender, onderwerp en het begin van het bericht?
          default: []
          selector: *telefoons

    opdrachten:
      name: Nieuwe inleveropdracht
      icon: mdi:clipboard-text-clock-outline
      collapsed: true
      input:
        opdracht_ontvangers:
          name: Wie krijgt de melding?
          description: >-
            Vak, opdracht en inleverdatum staan er altijd in; dat is niet
            vertrouwelijk. Leeg laten = geen meldingen over opdrachten.
          default: []
          selector: *telefoons
        opdracht_leerlingen:
          name: Over welk kind?
          description: Leeg laten = alle kinderen.
          default: []
          selector: *kinderen

    storingen:
      name: Storing of onderhoud bij Somtoday
      icon: mdi:alert-outline
      collapsed: true
      input:
        storing_ontvangers:
          name: Wie krijgt de melding?
          description: Leeg laten = geen meldingen over storingen.
          default: []
          selector: *telefoons

triggers:
  - trigger: event
    event_type: somtoday_new_record

variables:
  pad: !input dashboard
  instellingen:
    grade:
      ontvangers: !input cijfer_ontvangers
      inhoud: !input cijfer_inhoud
      leerlingen: !input cijfer_leerlingen
    registration:
      ontvangers: !input afwezig_ontvangers
      inhoud: !input afwezig_inhoud
      leerlingen: !input afwezig_leerlingen
    measure:
      ontvangers: !input maatregel_ontvangers
      inhoud: !input maatregel_inhoud
      leerlingen: !input maatregel_leerlingen
    message:
      ontvangers: !input bericht_ontvangers
      inhoud: !input bericht_inhoud
      leerlingen: []
    # Niet vertrouwelijk: iedere ontvanger krijgt de inhoud.
    assignment:
      ontvangers: !input opdracht_ontvangers
      inhoud: !input opdracht_ontvangers
      leerlingen: !input opdracht_leerlingen
    announcement:
      ontvangers: !input storing_ontvangers
      inhoud: !input storing_ontvangers
      leerlingen: []
  soort: "{{ trigger.event.data.kind }}"
  instelling: "{{ instellingen.get(soort, {}) }}"
  categorie: >-
    {{ {'grade': 'grades', 'registration': 'absences',
        'measure': 'measures', 'message': 'messages'}.get(soort, '') }}
  leerlingen: >-
    {% set l = instelling.get('leerlingen') %}
    {{ [l] if l is string and l else (l or []) }}
  # Per ontvanger: welke notify-dienst, en of die de inhoud mag zien.
  ontvangers: >-
    {% set o = instelling.get('ontvangers') %}
    {% set o = [o] if o is string and o else (o or []) %}
    {% set i = instelling.get('inhoud') %}
    {% set i = [i] if i is string and i else (i or []) %}
    {% set ns = namespace(items=[]) %}
    {% for d in o %}
      {% set ns.items = ns.items + [{'dienst': 'notify.mobile_app_' ~ (device_attr(d, 'name') | slugify), 'vol': d in i}] %}
    {% endfor %}
    {{ ns.items }}
  iemand_vol: "{{ ontvangers | selectattr('vol') | list | count > 0 }}"
  # "Somtoday (Fien Voorbeeld)" -> "Fien"
  kind_naam: >-
    {% set naam = device_attr(trigger.event.data.device_id, 'name') if trigger.event.data.device_id else '' %}
    {% set naam = (naam or '') | regex_replace('^Somtoday \\((.*)\\)$', '\\1') %}
    {{ naam.split(' ')[0] if naam else '' }}

conditions:
  - condition: template
    value_template: "{{ ontvangers | count > 0 }}"
  - condition: template
    value_template: >-
      {{ not leerlingen
         or not trigger.event.data.device_id
         or trigger.event.data.device_id in leerlingen }}

actions:
  # De inhoud wordt nu pas opgehaald, bij de integratie zelf: zo staat een
  # cijfer of bericht nooit in een entiteit die iedereen in huis kan lezen.
  # Altijd aangeroepen (zonder inhoud komt er gewoon niets terug), zodat het
  # antwoord in de rest van de automatisering beschikbaar is.
  - action: somtoday.get_records
    data:
      categories: ["{{ categorie or 'messages' }}"]
      uids: "{{ trigger.event.data.uids if (iemand_vol and categorie) else ['-'] }}"
      limit: 20
    response_variable: gegevens
  - variables:
      dagen: ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo']
      maanden: ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec']
      items: >-
        {%- set ns = namespace(items=[]) -%}
        {%- if soort in ['assignment', 'announcement'] -%}
          {%- set ns.items = trigger.event.data.get('items', []) -%}
        {%- elif iemand_vol and gegevens and gegevens.get('entries') -%}
          {%- for entry in gegevens.entries -%}
            {%- if soort == 'message' -%}
              {%- set ns.items = ns.items + (entry.get('messages') or []) -%}
            {%- else -%}
              {%- for s in entry.students -%}
                {%- if s.student_id == trigger.event.data.student_id -%}
                  {%- set lijst = {'grade': s.get('grades'), 'registration': s.get('absences'), 'measure': s.get('measures')}[soort] -%}
                  {%- set ns.items = ns.items + (lijst or []) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.items }}
      aantal: "{{ trigger.event.data.count | int(1) }}"
      titel: >-
        {%- set namen = {
          'grade': ('Nieuw cijfer', 'nieuwe cijfers'),
          'registration': ('Afwezigheid geregistreerd', 'nieuwe registraties'),
          'measure': ('Nieuwe maatregel', 'nieuwe maatregelen'),
          'message': ('Nieuw bericht van school', 'nieuwe berichten'),
          'assignment': ('Nieuwe inleveropdracht', 'nieuwe inleveropdrachten'),
          'announcement': ('Melding van Somtoday', 'meldingen van Somtoday') } -%}
        {%- set n = namen.get(soort, ('Somtoday', 'Somtoday')) -%}
        {%- set basis = n[0] if (aantal | int) == 1 else (aantal ~ ' ' ~ n[1]) -%}
        {{ basis ~ (' - ' ~ kind_naam if kind_naam else '') }}
      kort: Open de Somtoday-kaart om te kijken.
      bericht: >-
        {%- set soortnamen = {
          'unauthorised_absence': 'Ongeoorloofd afwezig', 'authorised_absence': 'Geoorloofd afwezig',
          'absence_observed': 'Afwezig', 'late': 'Te laat', 'removed_from_class': 'Uit de les gestuurd',
          'homework_not_done': 'Huiswerk niet gemaakt', 'materials_missing': 'Materiaal niet in orde' } -%}
        {%- set ns = namespace(lines=[]) -%}
        {%- for i in items[:5] -%}
          {%- set moment = (i.get('entered') or i.get('start') or i.get('date') or i.get('sent') or i.get('deadline')) -%}
          {%- set t = (moment | as_datetime | as_local) if moment else none -%}
          {%- set wanneer = (dagen[t.weekday()] ~ ' ' ~ t.day ~ ' ' ~ maanden[t.month - 1]) if t else '' -%}
          {%- if soort == 'grade' -%}
            {%- set regel = (i.subject or 'Vak') ~ ': ' ~ (i.result or '?')
                ~ (' (weging ' ~ (i.weight | round(1) | string | replace('.0', '')) ~ ')' if i.weight else '')
                ~ (' - ' ~ i.description if i.description else '') -%}
          {%- elif soort == 'registration' -%}
            {%- set regel = soortnamen.get(i.kind, i.kind) ~ ' ' ~ wanneer
                ~ (', ' ~ i.period ~ 'e uur' if i.period else '')
                ~ (' (' ~ i.subject ~ ')' if i.subject else '')
                ~ (' - ' ~ i.description if i.description else '') -%}
          {%- elif soort == 'measure' -%}
            {%- set regel = (i.description or 'Maatregel') ~ (' op ' ~ wanneer ~ ' ' ~ t.strftime('%H:%M') if t else '')
                ~ (' - ' ~ i.remarks if i.remarks else '') -%}
          {%- elif soort == 'message' -%}
            {%- set tekst = (i.body or '') -%}
            {%- set regel = (i.sender or 'School') ~ ': ' ~ (i.subject or '(geen onderwerp)')
                ~ ('\n' ~ (tekst[:200] ~ ('...' if tekst | length > 200 else '')) if tekst else '') -%}
          {%- elif soort == 'assignment' -%}
            {%- set regel = (i.subject or 'Vak') ~ ': ' ~ (i.topic or 'opdracht')
                ~ (' - inleveren uiterlijk ' ~ wanneer ~ ' ' ~ t.strftime('%H:%M') if t else '') -%}
          {%- else -%}
            {%- set regel = (i.subject or 'Melding') ~ (': ' ~ i.body if i.body else '') -%}
          {%- endif -%}
          {%- set ns.lines = ns.lines + [regel] -%}
        {%- endfor -%}
        {%- if not ns.lines -%}
          {%- set ns.lines = [kort] -%}
        {%- elif items | count > 5 -%}
          {%- set ns.lines = ns.lines + ['en nog ' ~ (items | count - 5) ~ ' meer'] -%}
        {%- endif -%}
        {{ ns.lines | join('\n') }}
  - repeat:
      for_each: "{{ ontvangers }}"
      sequence:
        - action: "{{ repeat.item.dienst }}"
          data:
            title: "{{ titel }}"
            message: "{{ bericht if repeat.item.vol else kort }}"
            data:
              clickAction: "{{ pad }}"
              url: "{{ pad }}"
              group: somtoday

# Meerdere soorten komen in dezelfde poll binnen, dus netjes achter elkaar.
mode: queued
max: 20
